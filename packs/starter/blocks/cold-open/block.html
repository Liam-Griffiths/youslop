{% extends "_base.html" %}
{% block head %}
<style>
.rule { position:absolute; left:12%; top:69%; width:76%; height:6px; background:var(--brand); }
.title { position:absolute; left:12%; right:12%; top:28%; height:36%; display:flex; align-items:flex-end; }
h1 { margin:0; width:100%; font:var(--weight-display, 700) 120px/1.02 var(--font-display, Inter),sans-serif; overflow-wrap:anywhere; }
.caption { position:absolute; left:12%; right:12%; top:16%; height:10%; }
p { margin:0; font:700 36px/1.2 var(--font-body, Inter),sans-serif; color:var(--brand); text-transform:uppercase; letter-spacing:.1em; overflow-wrap:anywhere; }
</style>
{% endblock %}
{% block body %}
<div class="rule" data-layer="rule" data-motion="wipe" data-start="0" data-duration="{{ duration }}"></div>
<div class="title" data-layer="title" data-motion="rise" data-start="0.2" data-duration="{{ duration - 0.2 }}">
<h1 data-var-text="title">{{ vars.title }}</h1></div>
<div class="caption" data-layer="caption" data-motion="fade" data-start="0.5" data-duration="{{ duration - 0.5 }}">
<p data-var-text="caption">{{ vars.caption }}</p></div>
{% endblock %}
