<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corkbored</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23e8c36a'/><text x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23000'>C</text></svg>">
</head>
<body>

<header class="topbar">
  <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle sidebar" aria-label="Toggle sidebar">
    <span></span><span></span><span></span>
  </button>
  <div class="brand" onclick="go('#/')" title="Idea in. Episode out.">
    <span class="mark" aria-hidden="true">C</span>
    <span class="wordmark">Cork<em>bored</em></span>
  </div>
  <div id="topbar-right" class="topbar-right"></div>
</header>

<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav">
      <a class="sidebar-link new" onclick="go('#/')">
        <span class="sidebar-icon">＋</span>New video</a>
      <a class="sidebar-link" data-route="standalone" onclick="goStandalone()"
         title="Videos that belong to no channel">
        <span class="sidebar-icon">▷</span>Standalone videos<span class="count" id="solo-count"></span></a>
      <a class="sidebar-link" data-route="library" onclick="go('#/library')">
        <span class="sidebar-icon">▦</span>Library</a>
    </nav>
    <div class="sidebar-section">
      <div class="sidebar-section-head">
        <span>Channels</span>
        <button class="sidebar-add" onclick="newChannel()" title="New channel">＋</button>
      </div>
      <nav class="sidebar-nav" id="sidebar-channels"></nav>
    </div>
    <div class="sidebar-spacer"></div>
    <nav class="sidebar-nav sidebar-footer">
      <a class="sidebar-link" data-route="guide" onclick="go('#/guide')">
        <span class="sidebar-icon">?</span>How it works</a>
      <a class="sidebar-link" data-route="settings" onclick="go('#/settings')">
        <span class="sidebar-icon">⚙</span>Settings</a>
    </nav>
  </aside>
  <main id="view"></main>
</div>

<div id="toast" class="toast"></div>
