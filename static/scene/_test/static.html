<!doctype html>
<meta charset="utf-8">
<title>Scene capture fixture</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0e0f11; }
  h1 { position: absolute; top: 120px; left: 160px; color: #f2f2f2; font: bold 96px sans-serif; }
  #box { position: absolute; top: 400px; left: 160px; width: 320px; height: 240px; background: #ff5a1f; }
</style>
<h1>Scene capture</h1><div id="box"></div>
<script>
  window.__ready = document.fonts.ready;
  window.__seek = async t => { await new Promise(resolve => requestAnimationFrame(resolve)); };
</script>
