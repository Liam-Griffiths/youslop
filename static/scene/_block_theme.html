{# Only block preparations opt in; scene slates and chapter cards keep their look. #}
{% if is_block | default(false) %}
<style>
:root {
 --font-display:{{ (block_theme.font_display | tojson) if block_theme.font_display else 'initial' }}!important;
 --font-body:{{ (block_theme.font_body | tojson) if block_theme.font_body else 'initial' }};
 --radius:{{ (block_theme.radius ~ 'px') if block_theme_radius_set | default(false) else 'initial' }};
 --weight-display:{{ {'regular':400,'bold':700,'heavy':800}.get(block_theme.weight, 'initial') }};
 --block-pace:{{ block_theme.pace }};
 --panel:{{ block_theme.panel or 'color-mix(in srgb,var(--bg) 95%,var(--ink))' }};
 --line:{{ block_theme.line or 'color-mix(in srgb,var(--bg) 90%,var(--ink))' }};
 --dim:{{ block_theme.dim or 'color-mix(in srgb,var(--bg) 35%,var(--ink))' }};
}
body { font-family:var(--font-body, Inter),sans-serif; }
:where(body > div,body > section,.panel,.caption-panel,.lower,.box,.photo,.milestone,.bar,.opening,.stack > *) { border-radius:var(--radius, 0px); }
{% if block_theme_radius_set | default(false) %}.intro-copy,.badge,.quiet-subscribe,.plate { border-radius:var(--radius, 0px); }{% endif %}
{% if block_theme.font_body %}body :where(p,span,div,td,th,text) { font-family:var(--font-body)!important; }{% endif %}
{% if block_theme.font_display %}body :where(h1,h2,h3,.display,.speaker,.quotation,.heading) { font-family:var(--font-display)!important; }{% endif %}
{% if block_theme_explicit | default(false) %}.folio { background:var(--bg);color:var(--ink); }{% endif %}
{% if block_theme.weight %}body :where(h1,h2,h3,.display,.speaker,.quotation,.heading) { font-weight:var(--weight-display)!important; }{% endif %}
</style>
{% endif %}
