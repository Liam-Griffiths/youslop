<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en" data-composition-id="{{ composition_id | default('scene') }}"
      data-width="{{ width }}" data-height="{{ height }}"
      data-budget="{{ budget | default(0.1) }}" data-duration="{{ duration }}" data-fps="{{ fps }}" data-seed="{{ seed | default(1) }}"
      style="--arrive-s:{{ frame.arrive_s }};--exit-ratio:{{ frame.exit_ratio }};--bg:{{ palette.ground }};--ink:{{ palette.ink }};--fg:{{ palette.ink }};--brand:{{ palette.accent }};--accent-2:{{ palette.accent2 }};--font-display:Archivo;--accent:{{ palette.accent }};--accent2:{{ palette.accent2 }}">
<head>
  <meta charset="utf-8">
  {% block csp %}{% endblock %}
  <title>{{ vars.title }}</title>
  <link rel="stylesheet" href="/static/scene/_base.css">
  <style>
    {% for name, url in fonts.items() %}
    @font-face { font-family: {{ name | tojson }}; src: url({{ url | tojson }}); font-display: block; }
    {% endfor %}
  </style>
  <script>window.__vars = {{ vars | tojson }};</script>
  <script id="scene-motion" type="application/json">{{ motion_presets | tojson }}</script>
  <script src="/static/scene/runtime.js"></script>
  <script src="/static/vendor/gsap/gsap.min.js"></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% if builder_alpha | default(false) %}<style>html,body {background:transparent!important}</style>{% endif %}
  {% block script %}{% endblock %}
</body>
</html>
