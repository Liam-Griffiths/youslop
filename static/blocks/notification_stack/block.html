{% extends '_blocks/chat_thread/screens_base.html' %}
{% block content %}
{% for row in s.rows %}
<div class="item panel notice" {{ layer('notice-'~loop.index,loop.index0*0.35) }} style="top:{{ s.y+loop.index0*s.gap }}px;height:{{ s.gap-18 }}px"><p class="small sender" data-fit>{{ row.label }}</p><p class="copy" data-fit style="height:{{ s.gap-120 }}px">{{ row.text }}</p></div>
{% endfor %}
{% endblock %}
