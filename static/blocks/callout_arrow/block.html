{% extends '_blocks/step_list/explainer_base.html' %}
{% block content %}
{{ photo('picture','picture',explain.x,explain.top,explain.w,explain.ph) }}
<svg class="annotation" {{ layer('annotation',0.3,'reveal',0.7) }} width="{{ explain.w }}" height="{{ explain.ph }}" style="left:{{ explain.x }}px;top:{{ explain.top }}px" viewBox="0 0 {{ explain.w }} {{ explain.ph }}">
{% set tx=16+vars.x*explain.inner_w %}{% set ty=16+vars.y*explain.inner_h %}
<path d="M{{ 16+vars.from_x*explain.inner_w }} {{ 16+vars.from_y*explain.inner_h }}L{{ tx }} {{ ty }}"/><circle cx="{{ tx }}" cy="{{ ty }}" r="12" fill="var(--accent)"/>
<path d="M-22 -14L0 0 -22 14" transform="translate({{ tx }} {{ ty }}) rotate({{ explain.angle }})"/>
</svg>
<p class="item caption" {{ layer('caption',0.5,'rise') }} data-fit data-var-text="label" style="left:{{ explain.x }}px;top:{{ explain.bottom-62 }}px;width:{{ explain.w }}px">{{ vars.label }}</p>
{% endblock %}
