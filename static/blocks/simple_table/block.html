{% extends '_blocks/number_slam/data_base.html' %}
{% block content %}
<div class="item" {{ layer('table',0,'rise') }} style="left:{{ data.x }}px;top:{{ data.top }}px;width:{{ data.w }}px"><table class="grid" style="height:{{ data.content_h }}px"><thead><tr><th><span class="cell single" data-fit data-var-text="column_label">{{ vars.column_label }}</span></th><th><span class="cell single" data-fit data-var-text="column_value">{{ vars.column_value }}</span></th></tr></thead><tbody>{% for row in data.rows %}<tr><td><span class="cell single" data-fit>{{ row.label }}</span></td><td><span class="cell single" data-fit>{{ row.value }}</span></td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
