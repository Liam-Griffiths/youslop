{% extends '_blocks/counter/numbers_base.html' %}
{% block content %}
{% for row in n.rows %}<div class="row spec" {{ layer('spec-'~loop.index,loop.index0*0.12,'fly-right') }} style="top:{{ n.top+loop.index0*n.gap }}px;height:{{ n.gap-8 }}px"><span data-fit>{{ row.label }}</span><span class="value accent" data-fit>{{ '%g'|format(row.value) }} {{ vars.unit }}</span></div>{% endfor %}
{% endblock %}
