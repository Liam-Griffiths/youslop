{% extends '_blocks/number_slam/data_base.html' %}
{% block content %}
<p class="item label mono dim" data-ground style="left:{{ data.x }}px;top:{{ data.top-60 }}px;width:{{ data.w }}px">{{ data.scale }}</p>
{% for row in data.rows %}{% set y=data.top+loop.index0*(100 if height > width else 82) %}
<div class="item label" data-ground style="left:{{ data.x }}px;top:{{ y }}px;width:{{ data.w }}px;height:64px"><span class="row-label">{{ row.label }}</span><span class="row-value">{{ '%g'|format(row.value) }}</span></div>
{% if row.value > 0 %}<div class="item bar" {{ layer('bar-'~loop.index,0.12*loop.index0,'reveal',0.7) }} style="left:{{ data.x }}px;top:{{ y+64 }}px;width:{{ data.w*row.ratio }}px"></div>{% endif %}
{% endfor %}
{% endblock %}
