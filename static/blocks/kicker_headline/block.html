{% extends "_blocks/chapter/text_base.html" %}
{% block body %}
<section class="copy headline clip" data-start="0" data-duration="{{ duration }}" data-anim="rise" data-anim-dur=".45">
<p class="label" data-var-text="kicker">{{ vars.kicker }}</p>
<h1 class="display" data-var-text="title">{{ vars.title }}</h1>

</section>
{% endblock %}
