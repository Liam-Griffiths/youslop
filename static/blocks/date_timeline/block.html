{% extends '_blocks/number_slam/data_base.html' %}
{% block content %}
<p class="item label dim" data-ground style="left:{{ data.x }}px;top:{{ data.top-60 }}px;width:{{ data.w }}px">MILESTONES · EQUAL SPACING</p>
{% for row in data.rows %}{% set portrait=height > width %}{% set step=data.w/data.rows|length %}
<div class="item milestone" {{ layer('date-'~loop.index,0.18*loop.index0,'reveal') }} style="left:{{ data.x if portrait else data.x+loop.index0*step }}px;top:{{ data.top+loop.index0*145 if portrait else data.top }}px;width:{{ data.w if portrait else step-20 }}px"><span class="mono">{{ row.date }}</span><p class="label">{{ row.label }}</p></div>
{% endfor %}
{% endblock %}
