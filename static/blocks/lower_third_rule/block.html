{% extends "_blocks/chapter/text_base.html" %}
{% block body %}
{% if vars.picture %}<img class="picture" data-var-src="picture" src="{{ vars.picture }}" alt="">{% endif %}
<section class="copy lower rule clip" data-start="0" data-duration="{{ duration }}" data-layer="layer-1" data-motion="rise" data-motion-duration=".35">
<h1 class="speaker" data-var-text="title">{{ vars.title }}</h1>
<p class="support" data-var-text="subtitle">{{ vars.subtitle }}</p>
</section>
{% endblock %}
