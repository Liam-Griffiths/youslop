{% extends '_blocks/chat_thread/screens_base.html' %}
{% block content %}
<div class="area panel ticker"><p class="small accent" data-fit style="height:44px" data-var-text="label">{{ vars.label }}</p></div>
<div class="area" {{ layer('headline',0,'none') }} data-path='[{"t":0,"x":120,"y":0},{"t":{{ duration-0.25 }},"x":0,"y":0,"ease":"linear"}]' style="left:{{ s.x+30 }}px;width:{{ s.w-180 }}px;top:{{ s.y+72 }}px;background:var(--panel)"><p class="copy" data-fit style="height:114px" data-var-text="text">{{ vars.text }}</p></div>
{% endblock %}
